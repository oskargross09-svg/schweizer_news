name: YouTube Testupload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth

      - name: Kurzes Testvideo erzeugen
        run: |
          ffmpeg -f lavfi -i color=c=black:s=1080x1920:d=3 \
                 -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test.mp4

      - name: Hochladen (nicht gelistet)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py test.mp4 \
            --title "Testupload (kann gelöscht werden)" \
            --description "API-Test" \
            --privacy unlisted
