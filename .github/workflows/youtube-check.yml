name: youtube-check
# Tests that the YOUTUBE_* secrets work (token refresh only, uploads nothing). Result: bot-logs branch, logs/youtube-check.txt
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/youtube.py --check > /tmp/yt-check.txt 2>&1 || true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - name: write result to bot-logs branch
        run: |
          git config user.name swiss-news-bot; git config user.email bot@users.noreply.github.com
          git fetch origin bot-logs && git checkout -B bot-logs origin/bot-logs || git checkout --orphan bot-logs
          git rm -rq --cached . 2>/dev/null; find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
          mkdir -p logs; (date -u +%FT%TZ; cat /tmp/yt-check.txt) > logs/youtube-check.txt
          git add logs; git commit -qm "youtube check"; git push origin bot-logs
